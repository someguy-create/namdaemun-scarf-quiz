<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6eee2"><title>남대문 스카프 아저씨 퀴즈</title>
<style>
:root{--ink:#29231f;--muted:#766b61;--paper:#fffaf3;--cream:#f6eee2;--orange:#ef7545;--line:#eadccc;--green:#397b5c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#ffe2c9,transparent 30%),radial-gradient(circle at 95% 25%,#f9dfd7,transparent 25%),var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 32px));margin:auto;padding:34px 0 52px}.hero,.panel{background:rgba(255,250,243,.96);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 50px #76502a12;padding:30px}.hero{text-align:center;padding:38px 28px}.tag{display:inline-block;background:#ffeadc;color:#a94c2d;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:800}h1{font-size:clamp(30px,6vw,48px);line-height:1.16;margin:18px 0 10px}.sub{color:var(--muted);line-height:1.7}.scarves{font-size:38px;margin:20px}.btn{border:0;background:var(--orange);color:white;border-radius:14px;padding:14px 22px;font-weight:850;font-size:16px;cursor:pointer}.panel{display:none;margin-top:18px}.panel.active{display:block}.bar{height:8px;background:#eee1d3;border-radius:99px;margin:12px 0 24px;overflow:hidden}.fill{height:100%;background:var(--orange);width:0}.muted{color:var(--muted);font-size:13px}.question{font-size:24px;line-height:1.45}.hint{background:#fff1df;border:1px dashed #edc59d;border-radius:13px;padding:12px;margin:14px 0;color:#815536}.options{display:grid;gap:10px}.option{background:#fffdf9;border:1.5px solid var(--line);border-radius:14px;padding:15px;text-align:left;font:inherit;cursor:pointer}.option.selected{border-color:var(--orange);background:#fff0e6}.option:disabled{opacity:1}.feedback{display:none;padding:14px;border-radius:13px;margin-top:14px;line-height:1.6}.feedback.show{display:block}.good{background:#eaf4ec;color:#285e42}.bad{background:#fff0ed;color:#873e37}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.score{font-size:60px;color:var(--orange);font-weight:900}.review{display:grid;gap:10px;text-align:left}.review div{background:#fffdf9;border:1px solid var(--line);padding:13px;border-radius:12px;line-height:1.6}footer{text-align:center;color:#928579;font-size:11px;line-height:1.7;margin:20px auto;max-width:620px}
</style></head><body><main class="wrap"><section class="hero" id="intro"><span class="tag">오늘의 도전 · 총 5문제</span><h1>남대문 스카프<br>아저씨 퀴즈</h1><p class="sub">“사지 마, 과소비야!”<br>아저씨의 입담과 유명세에 관한 문제를 풀고<br>진정한 찐팬인지 확인해 보세요.</p><div class="scarves">🧣🧣🧣🧣🧣</div><button class="btn" id="start">퀴즈 시작하기 →</button><p class="muted">객관식 · 복수 선택 · OX 퀴즈</p></section>
<section class="panel" id="quiz"><div class="muted" id="counter"></div><div class="bar"><div class="fill" id="progress"></div></div><div class="muted" id="type"></div><h2 class="question" id="question"></h2><div class="hint" id="hint"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn" style="background:#a99b8d" id="restart">처음으로</button><button class="btn" id="next" disabled>정답 확인하기</button></div></section>
<section class="panel" id="result" style="text-align:center"><span class="tag">QUIZ COMPLETE</span><div class="score" id="score"></div><h2 id="resultTitle"></h2><p class="sub" id="resultText"></p><div class="review" id="review"></div><br><button class="btn" id="again">다시 도전하기 ↻</button></section><footer>이 퀴즈는 팬 콘텐츠이며 남대문시장 상인 또는 관련 업체의 공식 사이트가 아닙니다.<br>인물 관련 세부 정보는 공개 보도 및 기존 소개 내용을 바탕으로 구성했으므로 일부 내용은 확인이 필요할 수 있습니다.</footer></main>
<script>
const qs=[
{type:"객관식",q:"스카프 아저씨가 운영하는 남대문시장 가게의 이름은?",o:["한양사","남대문상회","다다백화점","서울스카프"],a:[0],h:"아저씨의 SNS 별명과는 다른 이름이에요.",w:"한양사는 남대문시장에서 아저씨가 운영하는 잡화점으로 소개됐어요."},
{type:"객관식",q:"대표적인 스카프 판매 가격은?",o:["4장에 10,000원","6장에 10,000원","8장에 10,000원","10장에 10,000원"],a:[1],h:"우리가 만든 할머니 캐릭터의 가격표를 떠올려 보세요.",w:"대표 판매 구성은 스카프 6장에 10,000원이에요."},
{type:"복수 선택",q:"아저씨의 독특한 장사 스타일로 알려진 특징을 모두 고르세요.",o:["손님에게 과소비하지 말라고 농담한다","사지 말라고 장난스럽게 말한다","고가 상품만 집중적으로 권한다","손님과 농담 없이 조용히 거래한다"],a:[0,1],h:"일반적인 판매 방식과 어떤 점이 다른지 생각해 보세요.",w:"손님에게 구매를 말리는 듯한 유쾌한 농담과 입담이 화제가 됐어요."},
{type:"OX",q:"아저씨는 라이브 방송에서 한국 나이 44세이며 딸이 둘이라고 밝혔다.",o:["O · 참","X · 거짓"],a:[0],h:"본인의 라이브 방송에서 공개한 가족 이야기를 떠올려 보세요.",w:"이 내용은 기존 소개에서 언급됐지만, 정확한 사실 여부는 별도 확인이 필요해요."},
{type:"OX",q:"스카프 아저씨는 대형 TV 광고를 통해 처음 유명해졌다.",o:["O · 참","X · 거짓"],a:[1],h:"처음 화제가 된 곳은 전통적인 광고 매체가 아니라 온라인 플랫폼이었어요.",w:"손님이 촬영해 SNS에 올린 영상이 퍼지면서 유명해진 것으로 소개됐어요."}
];
let idx=0,answers=[],chosen=[];
const $=id=>document.getElementById(id);
function screen(id){["intro","quiz","result"].forEach(x=>{$(x).style.display=x===id?"block":"none"})}
function begin(){idx=0;answers=[];render();screen("quiz")}
function render(){let q=qs[idx];chosen=[];$("counter").textContent="QUESTION "+(idx+1)+" / "+qs.length;$("progress").style.width=(idx/qs.length*100)+"%";$("type").textContent=q.type;$("question").textContent=q.q;$("hint").textContent="💡 힌트: "+q.h;$("feedback").className="feedback";$("feedback").textContent="";$("options").innerHTML="";
q.o.forEach((v,i)=>{let b=document.createElement("button");b.className="option";b.textContent=(q.type==="OX"?"":String.fromCharCode(65+i)+". ")+v;b.onclick=()=>pick(i,b);$("options").appendChild(b)});$("next").disabled=true;$("next").textContent="정답 확인하기";$("next").onclick=check}
function pick(i,b){if(answers[idx])return;let q=qs[idx];if(q.type==="복수 선택"){chosen=chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i];b.classList.toggle("selected")}else{chosen=[i];[...$("options").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")} $("next").disabled=!chosen.length}
function check(){if(!chosen.length)return;let q=qs[idx],ok=[...chosen].sort().join()===[...q.a].sort().join();answers[idx]={ok};[...$("options").children].forEach((b,i)=>{b.disabled=true;if(q.a.includes(i))b.style.borderColor="#6da786";if(chosen.includes(i)&&!q.a.includes(i))b.style.borderColor="#d77a70"});$("feedback").className="feedback show "+(ok?"good":"bad");$("feedback").textContent=(ok?"정답이에요! 🎉 ":"아쉬워요! 💡 ")+q.w;$("next").textContent=idx===qs.length-1?"결과 보기":"다음 문제 →";$("next").onclick=()=>{idx++;if(idx<qs.length)render();else finish()}}
function finish(){let n=answers.filter(x=>x.ok).length;$("score").textContent=n+"/"+qs.length;$("resultTitle").textContent=n===5?"스카프 아저씨 찐팬 인정! 🏆":n>=3?"제법 아는군요! 🧣":"아직 입문 단계!";$("resultText").textContent="정답 "+n+"개를 맞혔어요. 해설을 읽고 다시 도전해 보세요!";$("review").innerHTML="";qs.forEach((q,i)=>{let d=document.createElement("div");d.innerHTML="<b>"+(i+1)+". "+q.q+" "+(answers[i].ok?"✓":"✕")+"</b><br>"+q.w;$("review").appendChild(d)});screen("result")}
$("start").onclick=begin;$("again").onclick=begin;$("restart").onclick=()=>screen("intro");screen("intro");
</script></body></html>
